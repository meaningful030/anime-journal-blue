<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>{% block title %}本機管理{% endblock %}｜動漫手札</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}"></head>
<body><header class="site-header manager-header wrap"><a href="{{ url_for('admin') if g.owner else url_for('login') }}" class="brand"><span class="brand-mark" aria-hidden="true">冊</span><span>動漫手札<small>LOCAL STUDIO</small></span></a><nav aria-label="本機管理導覽"><a href="{{ url_for('home') }}" target="_blank" rel="noopener">公開預覽 ↗</a>{% if g.owner %}<form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn secondary" type="submit">登出</button></form>{% endif %}</nav></header>
<main class="manager {% block width %}{% endblock %}">{% for message in get_flashed_messages() %}<div class="alert" role="status">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
